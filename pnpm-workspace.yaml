packages:
  - "apps/*"
  - "packages/*"

# Pacotes com scripts de build nativos: o Angular CLI os deixa desligados por padrão
# (os binários pré-compilados das dependências opcionais já bastam).
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  # Prisma: o script baixa o "schema engine" usado por `prisma migrate`. Pacotes oficiais.
  '@prisma/engines': true
  prisma: true
